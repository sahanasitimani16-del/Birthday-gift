<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Sacramento&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 30px 20px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.6);
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .photo-frame {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 4px solid #ff6b6b;
            overflow: hidden;
            background-color: #ffe3e3;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-frame span {
            font-size: 50px;
        }

        h1 {
            font-family: 'Sacramento', cursive;
            color: #ff4757;
            font-size: 3.2rem;
            margin-bottom: 10px;
            line-height: 1;
        }

        h2 {
            font-size: 1.3rem;
            color: #2f3542;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            font-size: 0.95rem;
            color: #57606f;
            line-height: 1.6;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 8px rgba(255, 71, 87, 0.4);
        }

        /* Mobile responsiveness optimization */
        @media (max-width: 480px) {
            .card {
                padding: 20px 15px;
            }
            h1 {
                font-size: 2.8rem;
            }
            h2 {
                font-size: 1.15rem;
            }
            p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="photo-frame">
            <span>🎂</span>
        </div>
        
        <h1>Happy Birthday!</h1>
        <h2>To an Amazing Person</h2>
        
        <p>May your day be filled with lots of love, laughter, and cake! Wishing you a fantastic year ahead packed with success and wonderful memories.</p>
        
        <button class="btn" onclick="triggerConfetti()">Celebrate! 🎉</button>
    </div>

    <script>
        // Trigger a burst of confetti automatically when the page loads
        window.onload = function() {
            triggerConfetti();
        };

        function triggerConfetti() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 }
            });
        }
    </script>
</body>
</html>
